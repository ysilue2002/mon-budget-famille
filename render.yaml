# Blueprint Render : déploie l'API (Docker, migrations incluses au démarrage)
# et le front (site statique Vite). Les variables sensibles se saisissent
# après le premier lancement dans le tableau de bord Render.

services:
  # API de synchronisation — connectée à la base PostgreSQL Supabase via
  # DATABASE_URL (déjà fournie : la chaîne du pooler aws-0-eu-west-1).
  - type: web
    name: mon-budget-famille-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      # Saisir la chaîne Supabase fournie quand Supabase le demande.
      # Rester sur une seule ligne, sans saut de ligne ni espace parasite.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Origine exacte du site statique front ci-dessous (sans slash final),
      # à compléter une fois son URL connue, ex. https://mon-budget-famille.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # Front PWA — bundle Vite servi en site statique.
  - type: web
    name: mon-budget-famille-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      # Routeur React : tout chemin enfant sert index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL publique de l'API : https://mon-budget-famille-api.onrender.com
      # (exposée au build Vite — saisir avant/après le premier build du site).
      - key: VITE_API_BASE_URL
        sync: false
    pullRequestPreviewsEnabled: false
