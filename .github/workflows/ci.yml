name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    name: Front — vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  api:
    name: API — typecheck + migration + E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monbudget
          POSTGRES_USER: budget
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d monbudget"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://budget@127.0.0.1:55432/monbudget
      JWT_SECRET: e2e-secret-de-test-au-moins-32-caracteres
      CORS_ORIGIN: http://localhost:5173
      PORT: 4400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Dépendances serveur
        run: npm ci
        working-directory: server
      - name: Typecheck serveur
        run: npm run typecheck
        working-directory: server
      - name: Migration du schéma
        run: npm run migrate
        working-directory: server
      - name: Démarrage de l'API
        run: |
          npx tsx src/index.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4400/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4400/api/v1/health
        working-directory: server
      - name: E2E synchronisation
        # Limite register 5/h/IP : l'API est relancée avant chaque script gourmand.
        run: node scripts/e2e-sync.mjs
      - name: E2E suppression vs édition hors ligne
        run: |
          kill -TERM $(pgrep -f 'tsx src/index.ts' | head -1) 2>/dev/null || true
          sleep 1
          (cd server && npx tsx src/index.ts > /tmp/api2.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4400/api/v1/health && break
            sleep 1
          done
          node scripts/e2e-delete.mjs
      - name: E2E purge
        run: |
          kill -TERM $(pgrep -f 'tsx src/index.ts' | head -1) 2>/dev/null || true
          sleep 1
          (cd server && npx tsx src/index.ts > /tmp/api3.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4400/api/v1/health && break
            sleep 1
          done
          node scripts/e2e-purge.mjs
      - name: E2E invitation
        run: |
          kill -TERM $(pgrep -f 'tsx src/index.ts' | head -1) 2>/dev/null || true
          sleep 1
          (cd server && npx tsx src/index.ts > /tmp/api4.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4400/api/v1/health && break
            sleep 1
          done
          node scripts/e2e-invite.mjs
      - name: E2E reset + suppression de compte
        run: |
          kill -TERM $(pgrep -f 'tsx src/index.ts' | head -1) 2>/dev/null || true
          sleep 1
          (cd server && npx tsx src/index.ts > /tmp/api5.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4400/api/v1/health && break
            sleep 1
          done
          node scripts/e2e-reset-delete.mjs

  docker:
    name: Docker — build image + démarrage + santé API
    runs-on: ubuntu-latest
    needs: [front, api]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env pour compose (secret de test renouvelé si non défini)
        run: |
          test -f .env || cat > .env <<EOF
          JWT_SECRET=${JWT_SECRET:-e2e-secret-de-test-au-moins-32-caracteres-longue}
          CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
          EOF
      - name: Build et démarrage (compose)
        run: docker compose up --build -d
      - name: Santé API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/v1/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4000/api/v1/health
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt complet
        if: always()
        run: docker compose down -v
