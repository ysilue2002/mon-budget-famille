<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Facture A4 — Assistant Commercial</title>
<style>
  /* Page de contrôle : une vraie facture aux dimensions exactes d'une feuille
     A4, pour juger avant l'impression en série — taille des textes, place du
     QR (24 mm), lisibilité du badge payé, marges. Les mesures sont celles des
     règles d'impression de l'application. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7e4da; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif; color: #14261b; }
  .bar { position: sticky; top: 0; z-index: 2; background: #14532d; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .bar b { font-size: 17px; }
  .bar p { margin: 0; font-size: 14px; color: #d7eadc; flex: 1 1 320px; }
  .bar select { min-height: 48px; max-width: 100%; padding: 8px 12px; border-radius: 12px; border: 2px solid #fff; background: #fff; color: #14532d; font: inherit; font-weight: 700; }
  .bar button { min-height: 48px; padding: 8px 16px; border-radius: 12px; border: 2px solid #fff; background: #fff; color: #14532d; font: inherit; font-weight: 700; cursor: pointer; }
  .wrap { padding: 24px 12px 48px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hint { font-size: 14px; color: #4a5a4f; max-width: 210mm; text-align: center; margin: 0; }
  .hint a { color: #14532d; font-weight: 700; }

  /* La feuille : 210 × 297 mm, marges 10 mm comme l'impression. */
  .sheet {
    width: 210mm; height: 297mm; padding: 10mm; background: #fff;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); color: #000; overflow: hidden;
  }
  .docBar { background: #111; height: 4mm; margin: 0 0 9mm; }
  .docHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; }
  .docTitle { font-size: 34pt; font-weight: 800; line-height: 1; letter-spacing: -1px; text-transform: uppercase; }
  .docNumber { font-size: 19pt; font-weight: 700; margin-top: 2mm; }
  .docMeta { font-size: 10pt; text-align: end; margin-top: 2mm; }
  .docBoxes { display: flex; gap: 8mm; margin: 13mm 0; }
  .docBox { flex: 1; border: 1.5px solid #111; border-radius: 4mm; padding: 5mm; font-size: 10pt; line-height: 1.5; }
  .docBox b { display: block; font-size: 12pt; margin-bottom: 2mm; }
  .docTable { width: 100%; border-collapse: collapse; margin: 0 0 7mm; }
  .docTable th, .docTable td { border: 1px solid #111; padding: 3mm; font-size: 10.5pt; text-align: start; }
  .docTable th { font-weight: 800; }
  .docTotals { margin-left: auto; width: 82mm; border: 1.5px solid #111; border-radius: 3mm; padding: 4mm; font-size: 11pt; font-weight: 800; text-align: end; }
  .docTotals div + div { margin-top: 2mm; font-size: 13pt; }
  .docPaid { display: inline-block; margin-top: 4mm; padding: 1mm 3mm; border-radius: 2mm; font-size: 9pt; font-weight: 700; }
  .docPaid.ok { background: #e5f5e9; color: #14532d; }
  .docPaid.warn { background: #fff4d6; color: #7a4a00; }
  .docNotes { display: flex; justify-content: space-between; gap: 10mm; font-size: 8pt; margin-top: 16mm; }
  .docNotes > div { flex: 1; }
  .docNotes > div:last-child { text-align: end; }
  .docQr { display: flex; flex-direction: column; align-items: center; gap: 2mm; margin-top: 10mm; }
  .docQr svg { width: 24mm; height: 24mm; }
  .docQr small { font-size: 8pt; color: #333; word-break: break-all; text-align: center; }
  .docBarBottom { margin: 12mm 0 0; }
  .empty { margin: 40mm auto; max-width: 120mm; font-size: 12pt; line-height: 1.6; text-align: center; }
  .empty a { color: #14532d; font-weight: 700; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .bar, .hint { display: none; }
    .wrap { padding: 0; }
    .sheet { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Facture A4</b>
  <select id="docPick" aria-label="Choisir le document"></select>
  <button id="printBtn" type="button">Imprimer</button>
</div>
<div class="wrap">
  <p class="hint" id="payHint">Facture choisie dans vos documents, à l'échelle réelle : texte, QR de 24 mm et badge payé. Imprimez à 100 %, sans « ajuster à la page ».</p>
  <section class="sheet" id="sheet"><p class="empty">Chargement…</p></section>
</div>
<script>
  const sheet = document.getElementById('sheet');
  const pick = document.getElementById('docPick');
  const payHint = document.getElementById('payHint');
  let state = null;
  let me = null;
  let docs = [];
  let qrSeq = 0;

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dayFR = (iso) => String(iso || '').split('-').reverse().join('/');
  const money = (n) => Math.round(Number(n) || 0).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g, '\u00a0') + ' ' + ((state && state.settings && state.settings.currency) || 'FCFA');
  const vatOf = (d) => Math.round(((Number(d.total) || 0) * (Number(d.vat) || 0)) / 100);
  const amountOf = (d) => (Number(d.vat) ? (Number(d.total) || 0) + vatOf(d) : Number(d.total) || 0);

  function message(html) {
    sheet.innerHTML = `<div class="empty">${html}</div>`;
    payHint.textContent = '';
  }

  function render(doc) {
    qrSeq += 1;
    const s = state.settings || {};
    const place = [s.address, s.district, s.city].filter(Boolean).join(' · ');
    const contact = [me && me.phone, me && me.email].filter(Boolean).join(' · ');
    const party = (state.parties || []).find((p) => p.name === doc.party) || {};
    const client = [doc.party, doc.clientPhone || party.phone, doc.clientEmail || party.email, party.address].filter(Boolean)
      .map((v) => `<div>${esc(v)}</div>`).join('');
    const lines = (Array.isArray(doc.lines) ? doc.lines : []).map((l) => `<tr><td>${esc(l.label)}</td><td>${esc(l.qty)}</td>
      <td>${money(+l.price)}</td><td>${money((+l.qty || 1) * (+l.price || 0))}</td></tr>`).join('');
    const rate = Math.max(0, Number(doc.vat) || 0);
    const title = doc.kind === 'DEV' ? 'Devis' : 'Facture';
    const paid = doc.kind === 'FAC'
      ? `<div class="docPaid ${doc.paidDate ? 'ok' : 'warn'}">${doc.paidDate ? `Payée · payée le ${dayFR(doc.paidDate)}` : 'Non payée'}</div>`
      : '';
    sheet.innerHTML = `
      <div class="docBar"></div>
      <div class="docHead">
        <div>
          <div class="docTitle">${title}</div>
          <div class="docNumber">N° ${esc(doc.number)}</div>
        </div>
        <div class="docMeta">
          <div>N° : ${esc(doc.number)}</div>
          <div>Date : ${dayFR(doc.date)}</div>
        </div>
      </div>
      <div class="docBoxes">
        <div class="docBox"><b>${esc(state.shop || 'Ma boutique')}</b><div>${esc(s.companyForm || '')}</div><div>${esc(place)}</div><div>${esc(contact)}</div></div>
        <div class="docBox"><b>Client</b>${client || '<div>—</div>'}</div>
      </div>
      <table class="docTable">
        <thead><tr><th>Désignation</th><th>Qté</th><th>Prix unitaire</th><th>Montant</th></tr></thead>
        <tbody>${lines || '<tr><td colspan="4">—</td></tr>'}</tbody>
      </table>
      <div class="docTotals">
        <div>Total HT : ${money(doc.total)}</div>
        ${rate ? `<div>TVA (${rate} %) : ${money(vatOf(doc))}</div>` : ''}
        <div>Total TTC : ${money(amountOf(doc))}</div>
      </div>
      ${paid}
      <div class="docNotes"><div>Merci de votre confiance.</div><div>${doc.kind === 'DEV' ? 'Devis valable 30 jours.' : ''}</div></div>
      <div class="docQr" id="qrBox"><small>Préparation du QR…</small></div>
      <div class="docBar docBarBottom"></div>`;
    payHint.textContent = `${title} ${doc.number} · ${dayFR(doc.date)} · ${money(amountOf(doc))}. Imprimez à 100 %, sans « ajuster à la page ».`;
    drawQr(doc);
  }

  /* Le QR d'une facture publiée porte le jeton du serveur : on le reprend tel
     quel quand la fiche existe déjà, sinon on renvoie vers l'application. Rien
     n'est publié depuis cette page. */
  async function tokenFor(ownerId, number) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ownerId + ':' + number));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
    } catch { return ''; }
  }
  let qrLoaded = null;
  function loadQr() {
    if (window.qrcode) return Promise.resolve(true);
    if (qrLoaded) return qrLoaded;
    qrLoaded = new Promise((resolve) => {
      const script = document.createElement('script');
      script.src = 'qrcode.js';
      script.onload = () => resolve(!!window.qrcode);
      script.onerror = () => resolve(false);
      document.head.appendChild(script);
    });
    return qrLoaded;
  }
  async function drawQr(doc) {
    const seq = qrSeq;
    let url = location.origin + '/?src=a4';
    let published = false;
    const token = await tokenFor(me && (me.ownerId || me.id), doc.number);
    if (token) {
      try {
        const r = await fetch('/f/' + token, { cache: 'no-store' });
        if (r.ok) { url = location.origin + '/f/' + token; published = true; }
      } catch { /* hors ligne : repli sur l'application */ }
    }
    if (seq !== qrSeq) return;
    const box = document.getElementById('qrBox');
    if (!box) return;
    const ok = await loadQr();
    if (seq !== qrSeq || !document.getElementById('qrBox')) return;
    if (!ok) { box.innerHTML = `<small>${esc(url)}</small>`; return; }
    try {
      const qr = window.qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
        + `<small>${published ? 'Scannez pour ouvrir la facture' : 'Scannez pour ouvrir l’application'}</small>`;
    } catch { box.innerHTML = `<small>${esc(url)}</small>`; }
  }

  async function main() {
    try {
      const [meRes, dataRes] = await Promise.all([
        fetch('/api/me', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ user: null })),
        fetch('/api/data', { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
      ]);
      me = meRes && meRes.user ? meRes.user : null;
      if (!me) { message('Connectez-vous pour voir vos factures.<br><a href="/">Ouvrir l’application</a>'); return; }
      if (!dataRes || !dataRes.json) { message('Aucune donnée sur ce compte pour le moment.<br><a href="/">Ouvrir l’application</a>'); return; }
      state = typeof dataRes.json === 'string' ? JSON.parse(dataRes.json) : dataRes.json;
      state.settings = state.settings || {};
      docs = (Array.isArray(state.docs) ? state.docs : []).filter((d) => d && d.number && ['FAC', 'DEV'].includes(d.kind));
      docs.sort((a, b) => (String(b.date) || '').localeCompare(String(a.date) || ''));
      if (!docs.length) { message('Aucune facture ni devis enregistré.<br><a href="/">Créer un document dans l’application</a>'); return; }
      pick.innerHTML = docs.map((d, i) => `<option value="${i}">${d.kind === 'DEV' ? 'Devis' : 'Facture'} ${esc(d.number)} · ${dayFR(d.date)} · ${money(amountOf(d))}</option>`).join('');
      pick.onchange = () => render(docs[Number(pick.value) || 0]);
      render(docs[0]);
    } catch {
      message('Impossible de charger la facture.<br><a href="/">Ouvrir l’application</a>');
    }
  }

  document.getElementById('printBtn').onclick = () => window.print();
  main();
</script>
</body>
</html>
