<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant Commercial</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brandLogo" id="shopLogo" aria-hidden="true"><img src="icons/logo-header.png" alt=""></span>
    <div class="brandText">
      <h1 id="appName">Assistant Commercial</h1>
      <span class="shop" id="shopName">Ma boutique</span>
    </div>
    <button class="pill gear" id="gearBtn" data-act="openSettings" aria-label="Réglages">⚙</button>
    <button class="pill" id="netState" data-act="openSettings">hors ligne</button>
  </div>
</header>
<main id="app"></main>
<div id="printArea"></div>
<nav id="nav">
  <button data-tab="vendre" class="on"><span class="ic">＋</span><span data-k="sell">Vendre</span></button>
  <button data-tab="stock"><span class="ic">▦</span><span data-k="stock">Stock</span></button>
  <button data-tab="clients" class="wide"><span class="ic">☎</span><span data-k="navClients">Clients / Fournisseurs</span></button>
  <button data-tab="docs"><span class="ic">▤</span><span data-k="navDocs">Papiers</span></button>
  <button data-tab="bilans"><span class="ic">💰</span><span data-k="bilans">Argent</span></button>
</nav>
<div id="cookieBar" class="cookieBar" hidden>
  <p id="cookieText"></p>
  <div class="cookieBtns">
    <button class="btn small" id="cookieYes" type="button">Accepter</button>
    <button class="btn small out" id="cookieNo" type="button">Refuser</button>
  </div>
</div>
<script src="qrcode.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
