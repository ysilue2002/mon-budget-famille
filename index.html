<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant Commercial</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--vert:#14532d;--vert2:#227842;--menthe:#e2f4e8;--creme:#fdf8ef;--ambre:#f59e0b;--encre:#1c211c;--gris:#5c6b5f;--rouge:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:var(--encre);font-size:18px;line-height:1.45;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--vert);color:#fff;padding:14px 16px 16px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
header .shop{font-size:15px;color:#d6f0dc}
header .state{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.pill{font-size:13px;background:#0f3d22;color:#d6f0dc;border-radius:999px;padding:4px 10px}
main{padding:16px;max-width:820px;margin:0 auto}
h2{font-size:20px;margin:0 0 12px}
.card{background:#fff;border:2px solid #d8e6da;border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px;color:var(--vert)}
label{display:block;font-size:14px;color:var(--gris);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid #cfdccf;border-radius:12px;background:#fff;color:var(--encre)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vert2);box-shadow:0 0 0 3px #cfe9d8}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
.btn{display:block;width:100%;padding:16px;font-size:19px;font-weight:800;background:var(--vert);color:#fff;margin-top:10px}
.btn.out{background:#fff;color:var(--vert);border:2px solid var(--vert)}
.btn.ambre{background:var(--ambre);color:#3b2600}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px;font-weight:700;margin:4px 6px 0 0;background:var(--vert);color:#fff}
.btn.small.out{background:#fff;color:var(--vert);border:2px solid var(--vert)}
.btn.small.whats{background:#25d366;color:#06301a}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.big .btn{margin-top:0;padding:22px 10px;font-size:20px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:2px solid #d8e6da;border-radius:16px;padding:12px}
.kpi b{display:block;font-size:24px;color:var(--vert);line-height:1.2}
.kpi span{font-size:13px;color:var(--gris)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef3ee}
.row:last-child{border-bottom:0}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--gris)}
.right{text-align:right}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--menthe);color:var(--vert);display:inline-block}
.tag.warn{background:#fef3c7;color:#92400e}
.tag.bad{background:#fee2e2;color:var(--rouge)}
.tag.ok{background:#dcfce7;color:#166534}
.empty{color:var(--gris);font-size:15px;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #d8e6da;display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
nav button{background:none;color:var(--gris);padding:10px 4px 12px;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--vert)}
nav button.on .ic{transform:translateY(-1px)}
.err{color:var(--rouge);font-size:14px;font-weight:700;margin-top:8px}
.hint{font-size:13px;color:var(--gris);margin-top:6px}
.line-row{display:grid;grid-template-columns:1fr 70px 110px 36px;gap:6px;margin-bottom:6px}
.line-row input{padding:9px}
.line-row button{background:#fee2e2;color:var(--rouge);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(12,30,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
@media(min-width:720px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
</style>
</head>
<body>
<header>
  <h1>Assistant Commercial</h1>
  <div class="state">
    <span class="shop" id="shopName">Ma boutique</span>
    <span class="pill" id="netState">hors ligne</span>
  </div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="vendre" class="on"><span class="ic">＋</span>Vendre</button>
  <button data-tab="stock"><span class="ic">▦</span>Stock</button>
  <button data-tab="clients"><span class="ic">☎</span>Clients</button>
  <button data-tab="docs"><span class="ic">▤</span>Documents</button>
  <button data-tab="bilans"><span class="ic">◔</span>Bilans</button>
</nav>
<script>
const KEY = 'assistant-commercial.v1';
const DEFAULT_REMINDER = "Bonjour [Nom du Client], c'est [Nom de la Boutique]. La facture [Numéro Facture] du [Date Facture] d'un montant de [Montant] reste à régler. Merci de votre confiance.";
const empty = () => ({ shop: '', products: [], parties: [], sales: [], expenses: [], withdrawals: [], docs: [], seq: { DEV: 0, FAC: 0 }, reminder: DEFAULT_REMINDER });
let db = load();
let tab = 'vendre';
let draft = null;

function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? Object.assign(empty(), JSON.parse(raw)) : empty(); }
  catch { return empty(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const fr = (n) => Math.round(n || 0).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g, ' ');
const money = (n) => fr(n) + ' FCFA';
const day = (iso) => iso.split('-').reverse().join('/');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byDate = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
const inPeriod = (date, p) => {
  if (p === 'jour') return date === today();
  if (p === 'mois') return date.slice(0, 7) === today().slice(0, 7);
  if (p === 'annee') return date.slice(0, 4) === today().slice(0, 4);
  return true;
};
const creditOf = (s) => Math.max(0, s.total - s.paid);
const totalDue = () => db.sales.reduce((t, s) => t + creditOf(s), 0);
const stockValue = () => db.products.reduce((t, p) => t + p.qty * p.buy, 0);
const num = (kind) => { const y = new Date().getFullYear(); db.seq[kind] = (db.seq[kind] || 0) + 1; return kind + '-' + y + '-' + String(db.seq[kind]).padStart(3, '0'); };

/* ---------- rendu ---------- */
function render() {
  document.getElementById('shopName').textContent = db.shop || 'Ma boutique';
  document.getElementById('netState').textContent = navigator.onLine ? 'connecté' : 'hors ligne';
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const view = { vendre, stock, clients, docs, bilans }[tab];
  document.getElementById('app').innerHTML = view();
  if (tab === 'docs' && draft) document.getElementById('app').innerHTML += docForm();
}

/* ---------- Vendre ---------- */
function vendre() {
  const t = db.sales.filter((s) => s.date === today());
  const ca = t.reduce((a, s) => a + s.total, 0);
  return `
  <div class="kpis">
    <div class="kpi"><span>Ventes du jour</span><b>${money(ca)}</b></div>
    <div class="kpi"><span>Argent dehors</span><b>${money(totalDue())}</b></div>
  </div>
  <div class="big">
    <button class="btn" data-act="sale">＋ Vente</button>
    <button class="btn out" data-act="expense">− Dépense</button>
  </div>
  <button class="btn out" data-act="withdraw">Prélèvement personnel</button>
  <div class="card" style="margin-top:16px">
    <h3>Aujourd'hui</h3>
    ${[...t.map(saleRow), ...db.expenses.filter((e) => e.date === today()).map(expRow), ...db.withdrawals.filter((w) => w.date === today()).map(wdRow)].join('') || '<p class="empty">Rien encore aujourd\'hui.</p>'}
  </div>`;
}
const saleRow = (s) => `<div class="row"><div><div class="t">Vente ${money(s.total)}</div><div class="s">${esc(s.method)}${s.party ? ' · ' + esc(s.party) : ''}${s.product ? ' · ' + esc(s.product) + ' ×' + s.qty : ''}</div></div><div class="right">${creditOf(s) ? `<span class="tag warn">reste ${money(creditOf(s))}</span>` : '<span class="tag ok">payé</span>'}</div></div>`;
const expRow = (e) => `<div class="row"><div><div class="t">Dépense ${money(e.amount)}</div><div class="s">${esc(e.label || 'autre')} · ${esc(e.method)}</div></div></div>`;
const wdRow = (w) => `<div class="row"><div><div class="t">Mon argent ${money(w.amount)}</div><div class="s">prélèvement personnel</div></div></div>`;

/* ---------- Stock ---------- */
function stock() {
  const p = [...db.products].sort((a, b) => a.name.localeCompare(b.name));
  return `
  <div class="kpis">
    <div class="kpi"><span>Valeur du stock</span><b>${money(stockValue())}</b></div>
    <div class="kpi"><span>À renouveler</span><b>${p.filter((x) => x.qty <= x.alert).length}</b></div>
  </div>
  <div class="card">
    <h3>Articles</h3>
    ${p.map((x) => `<div class="row"><div><div class="t">${esc(x.name)}</div><div class="s">achat ${money(x.buy)} · vente ${money(x.sell)} · marge ${money(x.sell - x.buy)}</div></div><div class="right">${x.qty <= 0 ? '<span class="tag bad">rupture</span>' : x.qty <= x.alert ? '<span class="tag warn">reste ' + x.qty + '</span>' : '<span class="tag">' + x.qty + '</span>'}</div></div>`).join('') || '<p class="empty">Aucun article.</p>'}
  </div>
  <div class="card">
    <h3>Ajouter un article</h3>
    <label>Nom</label><input id="pName" placeholder="Savon">
    <label>Prix d'achat</label><input id="pBuy" inputmode="numeric" placeholder="0">
    <label>Prix de vente</label><input id="pSell" inputmode="numeric" placeholder="0">
    <label>Quantité en stock</label><input id="pQty" inputmode="numeric" value="0">
    <label>Alertier à partir de</label><input id="pAlert" inputmode="numeric" value="3">
    <button class="btn" data-act="addProduct">Enregistrer l'article</button>
  </div>`;
}

/* ---------- Clients ---------- */
function clients() {
  const due = db.sales.filter((s) => creditOf(s) > 0);
  const names = [...new Set(due.map((s) => s.party || 'Sans nom'))];
  return `
  <div class="kpis">
    <div class="kpi"><span>Argent dehors</span><b>${money(totalDue())}</b></div>
    <div class="kpi"><span>Clients concernés</span><b>${names.length}</b></div>
  </div>
  <div class="card">
    <h3>Ce que l'on me doit</h3>
    ${names.map((n) => {
      const list = due.filter((s) => (s.party || 'Sans nom') === n);
      const sum = list.reduce((a, s) => a + creditOf(s), 0);
      const phone = (db.parties.find((p) => p.name === n) || {}).phone || '';
      return `<div class="row"><div><div class="t">${esc(n)}</div><div class="s">${money(sum)} · ${list.length} vente(s)</div></div><div class="right">
        <button class="btn small" data-act="pay" data-name="${esc(n)}">Il a payé</button>
        <button class="btn small whats" data-act="wa" data-name="${esc(n)}">WhatsApp</button>
      </div></div>`;
    }).join('') || '<p class="empty">Personne ne vous doit rien.</p>'}
  </div>
  <div class="card">
    <h3>Fiche client</h3>
    <label>Nom</label><input id="cName" placeholder="Awa Traoré">
    <label>Téléphone</label><input id="cPhone" inputmode="tel" placeholder="+225 07 00 00 00 00">
    <button class="btn" data-act="addParty">Enregistrer le client</button>
    <p class="hint">Le numéro sert uniquement au bouton WhatsApp.</p>
  </div>`;
}

/* ---------- Documents ---------- */
function docs() {
  const list = [...db.docs].sort(byDate);
  return `
  <div class="kpis">
    <div class="kpi"><span>Devis</span><b>${db.docs.filter((d) => d.kind === 'DEV').length}</b></div>
    <div class="kpi"><span>Factures</span><b>${db.docs.filter((d) => d.kind === 'FAC').length}</b></div>
  </div>
  <button class="btn" data-act="newDoc">＋ Nouveau devis</button>
  <div class="card" style="margin-top:16px">
    <h3>Mes documents</h3>
    ${list.map((d) => `<div class="row"><div><div class="t">${esc(d.kind)} · ${esc(d.number)}</div><div class="s">${day(d.date)} · ${esc(d.party || 'sans client')} · ${money(d.total)}</div></div><div class="right">
      ${d.kind === 'DEV' ? `<button class="btn small" data-act="toFacture" data-id="${d.id}">Facture</button>` : ''}
      <button class="btn small whats" data-act="waDoc" data-id="${d.id}">Envoyer</button>
    </div></div>`).join('') || '<p class="empty">Aucun document.</p>'}
  </div>`;
}
function docForm() {
  const rows = draft.lines.map((l, i) => `<div class="line-row">
    <input data-l="label" data-i="${i}" placeholder="Prestation" value="${esc(l.label)}">
    <input data-l="qty" data-i="${i}" inputmode="numeric" value="${l.qty}">
    <input data-l="price" data-i="${i}" inputmode="numeric" value="${l.price}">
    <button data-act="delLine" data-i="${i}">✕</button></div>`).join('');
  return `<div class="modal"><div class="sheet">
    <h2>Nouveau devis</h2>
    <label>Client</label><input id="dParty" value="${esc(draft.party)}" placeholder="Nom du client">
    <p class="hint">Désignation, quantité, prix unitaire.</p>
    <div id="lines">${rows}</div>
    <button class="btn out" data-act="addLine">＋ Ajouter une ligne</button>
    <div class="row" style="margin-top:10px"><div class="t">Total</div><div class="t">${money(draft.lines.reduce((a, l) => a + (+l.qty || 0) * (+l.price || 0), 0))}</div></div>
    <button class="btn" data-act="saveDoc">Enregistrer le devis</button>
    <button class="btn out" data-act="closeDoc">Annuler</button>
  </div></div>`;
}

/* ---------- Bilans ---------- */
function bilans() {
  const p = window.__period || 'mois';
  const sales = db.sales.filter((s) => inPeriod(s.date, p));
  const exp = db.expenses.filter((e) => inPeriod(e.date, p));
  const ca = sales.reduce((a, s) => a + s.total, 0);
  const cash = sales.reduce((a, s) => a + s.paid, 0);
  const dep = exp.reduce((a, e) => a + e.amount, 0);
  const cogs = sales.reduce((a, s) => a + (s.cost || 0), 0);
  const profit = ca - cogs - dep;
  const due = db.sales.reduce((a, s) => a + creditOf(s), 0);
  return `
  <div class="card">
    <h3>Période</h3>
    <div class="big">
      <button class="btn ${p === 'jour' ? '' : 'out'}" data-act="period" data-p="jour">Aujourd'hui</button>
      <button class="btn ${p === 'mois' ? '' : 'out'}" data-act="period" data-p="mois">Ce mois</button>
      <button class="btn ${p === 'annee' ? '' : 'out'}" data-act="period" data-p="annee">Cette année</button>
      <button class="btn ${p === 'tout' ? '' : 'out'}" data-act="period" data-p="tout">Tout</button>
    </div>
  </div>
  <div class="kpis">
    <div class="kpi"><span>Chiffre d'affaires</span><b>${money(ca)}</b></div>
    <div class="kpi"><span>Argent encaissé</span><b>${money(cash)}</b></div>
    <div class="kpi"><span>Dépenses</span><b>${money(dep)}</b></div>
    <div class="kpi"><span>Bénéfice</span><b>${money(profit)}</b></div>
  </div>
  <div class="card">
    <div class="row"><div class="t">Argent dehors</div><div class="t">${money(due)}</div></div>
    <div class="row"><div class="t">Valeur du stock</div><div class="t">${money(stockValue())}</div></div>
    <div class="row"><div class="t">Prélèvements personnels</div><div class="t">${money(db.withdrawals.filter((w) => inPeriod(w.date, p)).reduce((a, w) => a + w.amount, 0))}</div></div>
  </div>
  <p class="hint">Bénéfice = ventes − coût des articles vendus − dépenses. Le prélèvement personnel n'est pas une dépense.</p>`;
}

/* ---------- actions ---------- */
function modal(html) {
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="sheet">${html}</div>`;
  d.addEventListener('click', (e) => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
  return d;
}
const current = [];

function saleModal() {
  const d = modal(`
    <h2>Nouvelle vente</h2>
    <label>Montant</label><input id="sAmount" inputmode="numeric" placeholder="0">
    <label>Moyen de paiement</label>
    <select id="sMethod"><option>Espèces</option><option>Orange Money</option><option>Wave</option><option>MTN</option><option>Moov</option><option>Banque</option></select>
    <label>Article (facultatif)</label>
    <select id="sProduct"><option value="">— aucun —</option>${db.products.map((p) => `<option value="${p.id}">${esc(p.name)} (${p.qty})</option>`).join('')}</select>
    <label>Quantité</label><input id="sQty" inputmode="numeric" value="1">
    <label>Client (pour un crédit)</label><input id="sParty" placeholder="Nom du client">
    <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="sCredit" style="width:auto"> <span>Il paiera plus tard</span></label>
    <button class="btn" id="sOk">Enregistrer la vente</button>
    <button class="btn out" id="sNo">Annuler</button>
    <p class="err" id="sErr"></p>`);
  d.querySelector('#sNo').onclick = () => d.remove();
  d.querySelector('#sOk').onclick = () => {
    let total = Math.round(+d.querySelector('#sAmount').value || 0);
    const pid = d.querySelector('#sProduct').value;
    const qty = Math.max(1, Math.round(+d.querySelector('#sQty').value || 1));
    const credit = d.querySelector('#sCredit').checked;
    const party = d.querySelector('#sParty').value.trim();
    if (total <= 0) { d.querySelector('#sErr').textContent = 'Entrez un montant.'; return; }
    if (credit && !party) { d.querySelector('#sErr').textContent = 'Pour un crédit, écrivez le nom du client.'; return; }
    let product = null, cost = 0;
    if (pid) {
      const p = db.products.find((x) => x.id === pid);
      if (p) {
        if (p.qty < qty) { d.querySelector('#sErr').textContent = 'Stock insuffisant : il reste ' + p.qty + '.'; return; }
        p.qty -= qty; product = p.name; cost = qty * p.buy;
        if (!total) total = qty * p.sell;
      }
    }
    db.sales.push({ id: uid(), date: today(), total, paid: credit ? 0 : total, method: d.querySelector('#sMethod').value, party, product, qty: product ? qty : 0, cost });
    if (party && !db.parties.some((x) => x.name.toLowerCase() === party.toLowerCase())) db.parties.push({ id: uid(), name: party, phone: '' });
    save(); d.remove(); render();
  };
}

function payModal(name) {
  const list = db.sales.filter((s) => (s.party || 'Sans nom') === name && creditOf(s) > 0);
  const sum = list.reduce((a, s) => a + creditOf(s), 0);
  const d = modal(`<h2>${esc(name)}</h2><p>Il doit ${money(sum)}.</p>
    <label>Montant reçu</label><input id="payAmt" inputmode="numeric" value="${sum}">
    <button class="btn" id="payOk">Enregistrer le paiement</button>
    <button class="btn out" id="payNo">Annuler</button><p class="err" id="payErr"></p>`);
  d.querySelector('#payNo').onclick = () => d.remove();
  d.querySelector('#payOk').onclick = () => {
    let amount = Math.round(+d.querySelector('#payAmt').value || 0);
    if (amount <= 0) { d.querySelector('#payErr').textContent = 'Entrez un montant.'; return; }
    for (const s of list) { if (!amount) break; const take = Math.min(amount, creditOf(s)); s.paid += take; amount -= take; s.date = s.date; }
    save(); d.remove(); render();
  };
}

function reminderFor(name) {
  const list = db.sales.filter((s) => (s.party || 'Sans nom') === name && creditOf(s) > 0);
  const sum = list.reduce((a, s) => a + creditOf(s), 0);
  const first = list[list.length - 1] || { id: '', date: today() };
  const doc = db.docs.find((d) => (d.party || '') === name) || { number: first.id ? 'vente ' + first.id.slice(0, 6) : '—', date: first.date };
  return db.reminder
    .replaceAll('[Nom du Client]', name)
    .replaceAll('[Nom de la Boutique]', db.shop || 'Ma boutique')
    .replaceAll('[Numéro Facture]', doc.number)
    .replaceAll('[Date Facture]', day(doc.date))
    .replaceAll('[Montant]', money(sum));
}
function wa(name, phone) {
  const text = encodeURIComponent(reminderFor(name));
  const clean = (phone || '').replace(/[^\d+]/g, '');
  window.open(clean ? `https://wa.me/${clean.replace('+', '')}?text=${text}` : `https://wa.me/?text=${text}`, '_blank');
}

/* ---------- délégation ---------- */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('#nav button');
  if (nav) { tab = nav.dataset.tab; draft = null; render(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'sale') saleModal();
  if (act === 'expense') {
    const d = modal(`<h2>Nouvelle dépense</h2><label>Montant</label><input id="eAmt" inputmode="numeric"><label>Motif</label><select id="eLabel"><option>Transport</option><option>Loyer</option><option>Électricité</option><option>Salaire</option><option>Marchandise</option><option>Autre</option></select><label>Moyen de paiement</label><select id="eMethod"><option>Espèces</option><option>Orange Money</option><option>Wave</option><option>MTN</option><option>Moov</option><option>Banque</option></select><button class="btn" id="eOk">Enregistrer</button><button class="btn out" id="eNo">Annuler</button><p class="err" id="eErr"></p>`);
    d.querySelector('#eNo').onclick = () => d.remove();
    d.querySelector('#eOk').onclick = () => {
      const amount = Math.round(+d.querySelector('#eAmt').value || 0);
      if (!amount) { d.querySelector('#eErr').textContent = 'Entrez un montant.'; return; }
      db.expenses.push({ id: uid(), date: today(), amount, label: d.querySelector('#eLabel').value, method: d.querySelector('#eMethod').value });
      save(); d.remove(); render();
    };
  }
  if (act === 'withdraw') {
    const d = modal(`<h2>Prélèvement personnel</h2><p class="hint">Cet argent sort de la caisse pour vous, ce n'est pas une dépense de la boutique.</p><label>Montant</label><input id="wAmt" inputmode="numeric"><button class="btn" id="wOk">Enregistrer</button><button class="btn out" id="wNo">Annuler</button><p class="err" id="wErr"></p>`);
    d.querySelector('#wNo').onclick = () => d.remove();
    d.querySelector('#wOk').onclick = () => {
      const amount = Math.round(+d.querySelector('#wAmt').value || 0);
      if (!amount) { d.querySelector('#wErr').textContent = 'Entrez un montant.'; return; }
      db.withdrawals.push({ id: uid(), date: today(), amount });
      save(); d.remove(); render();
    };
  }
  if (act === 'addProduct') {
    const name = document.getElementById('pName').value.trim();
    if (!name) return;
    db.products.push({ id: uid(), name, buy: Math.round(+document.getElementById('pBuy').value || 0), sell: Math.round(+document.getElementById('pSell').value || 0), qty: Math.round(+document.getElementById('pQty').value || 0), alert: Math.round(+document.getElementById('pAlert').value || 0) });
    save(); render();
  }
  if (act === 'addParty') {
    const name = document.getElementById('cName').value.trim();
    if (!name) return;
    const phone = document.getElementById('cPhone').value.trim();
    const found = db.parties.find((p) => p.name.toLowerCase() === name.toLowerCase());
    if (found) found.phone = phone; else db.parties.push({ id: uid(), name, phone });
    save(); render();
  }
  if (act === 'pay') payModal(b.dataset.name);
  if (act === 'wa') wa(b.dataset.name, (db.parties.find((p) => p.name === b.dataset.name) || {}).phone);
  if (act === 'newDoc') { draft = { party: '', lines: [{ label: '', qty: 1, price: 0 }] }; render(); }
  if (act === 'addLine') { draft.lines.push({ label: '', qty: 1, price: 0 }); syncDraft(); render(); }
  if (act === 'delLine') { draft.lines.splice(+b.dataset.i, 1); if (!draft.lines.length) draft.lines.push({ label: '', qty: 1, price: 0 }); render(); }
  if (act === 'closeDoc') { draft = null; render(); }
  if (act === 'saveDoc') {
    const partyInput = document.getElementById('dParty');
    if (partyInput) draft.party = partyInput.value.trim();
    syncDraft();
    const lines = draft.lines.filter((l) => l.label.trim() && +l.price > 0);
    if (!lines.length) return;
    const total = lines.reduce((a, l) => a + (+l.qty || 1) * (+l.price || 0), 0);
    db.docs.push({ id: uid(), kind: 'DEV', number: num('DEV'), date: today(), party: draft.party, lines, total, status: 'devis' });
    draft = null; save(); tab = 'docs'; render();
  }
  if (act === 'toFacture') {
    const d = db.docs.find((x) => x.id === b.dataset.id);
    if (!d || d.kind !== 'DEV') return;
    d.kind = 'FAC'; d.number = num('FAC');
    save(); render();
  }
  if (act === 'waDoc') {
    const d = db.docs.find((x) => x.id === b.dataset.id);
    if (!d) return;
    const phone = (db.parties.find((p) => p.name === d.party) || {}).phone || '';
    const text = `${d.kind === 'DEV' ? 'Devis' : 'Facture'} ${d.number} du ${day(d.date)} — ${money(d.total)}. ${db.shop || ''}`;
    const clean = (phone || '').replace(/[^\d+]/g, '');
    window.open(clean ? `https://wa.me/${clean.replace('+', '')}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }
  if (act === 'period') { window.__period = b.dataset.p; render(); }
});
function syncDraft() {
  document.querySelectorAll('#lines input').forEach((el) => {
    const i = +el.dataset.i, k = el.dataset.l;
    if (draft && draft.lines[i]) draft.lines[i][k] = el.value;
  });
}

/* ---------- premier lancement ---------- */
if (!db.shop) {
  const d = modal(`<h2>Bienvenue</h2><p>Comment s'appelle votre boutique ?</p>
    <input id="wShop" placeholder="Chez Awa">
    <button class="btn" id="wOk">Commencer</button>`);
  d.querySelector('#wOk').onclick = () => {
    const v = d.querySelector('#wShop').value.trim();
    if (!v) return;
    db.shop = v; save(); d.remove(); render();
  };
}
window.addEventListener('online', render);
window.addEventListener('offline', render);
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
