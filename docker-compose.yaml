services:
  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monbudget}
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bee5ceed-76d2-4da4-a3b3-9fbd7a672455}
    ports:
      - '55432:5432'
    restart: unless-stopped
    volumes:
      - pgsqldata:/var/lib/postgresql/data

  server:
    build: .
    env_file: .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-budget}:${POSTGRES_PASSWORD:-bee5ceed-76d2-4da4-a3b3-9fbd7a672455}@db:5432/${POSTGRES_DB:-monbudget}
      PORT: 4000
    ports:
      - '4000:4000'
    restart: unless-stopped
    # La migration SQL tourne au premier démarrage puis l'API démarre
    # (dist/db/migrate.js est idempotent : schema_migrations).
    command: sh -c 'node dist/db/migrate.js && node dist/index.js'

volumes:
  pgsqldata:
